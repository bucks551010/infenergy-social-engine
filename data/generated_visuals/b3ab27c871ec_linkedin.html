<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infenergy Social Card</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #081722; font-family: 'Montserrat', 'Segoe UI', sans-serif; }
        .card { width: 1200px; height: 627px; margin: 0 auto; background: linear-gradient(180deg, #0b1f2a 0%, #225376 100%); color: #fff; padding: 64px; position: relative; overflow: hidden; }
        .frame { position: absolute; inset: 28px; border: 3px solid #8fd3ff; border-radius: 32px; opacity: 0.9; }
        .inner { position: absolute; inset: 52px; background: rgba(18, 50, 71, 0.9); border-radius: 24px; padding: 44px; }
        .brand { color: #d7f3ff; font-size: 34px; font-weight: 700; letter-spacing: 0.02em; }
        .stage { color: #8fd3ff; font-size: 22px; margin-top: 12px; text-transform: uppercase; }
        .hook { margin-top: 34px; font-size: 40px; line-height: 1.12; font-weight: 800; max-width: 720px; }
        .topic { margin-top: 22px; color: #d9edf8; font-size: 28px; line-height: 1.35; max-width: 720px; }
        .product { margin-top: 20px; color: #ffe7a8; font-size: 28px; font-weight: 600; max-width: 720px; }
        .cta { position: absolute; left: 44px; right: 44px; bottom: 44px; background: #1f6f8b; border-radius: 18px; padding: 18px 26px; text-align: center; font-size: 24px; font-weight: 700; }
        .image-wrap { position: absolute; right: 44px; top: 120px; width: 330px; height: 330px; border-radius: 22px; border: 3px solid #8fd3ff; background: #0d2230; display: flex; align-items: center; justify-content: center; padding: 18px; }
        .image-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div class="card">
        <div class="frame"></div>
        <div class="inner">
            <div class="brand">Infenergy Power</div>
            <div class="stage">ATTENTION</div>
            <div class="hook">Where does 5-in-1 Portable Car Jump Starter with Air Compressor fit in a practical outage plan?</div>
            <div class="topic">What happens to your solar during a grid outage</div>
            <div class="product">Featured product: 5-in-1 Portable Car Jump Starter with Air Compressor</div>
            <div class="cta">See your custom runtime plan</div>
            <div class="image-wrap"><img src="https://infenergypower.com/wp-content/uploads/2025/08/Hc6124e2203404e9eaafcaf8993982781L.jpg" alt="Product visual" /></div>
        </div>
    </div>
</body>
</html>
